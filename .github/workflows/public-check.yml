name: Public Source Verification
on: [push, pull_request]
jobs:
  source-verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r windows/requirements_15.2.txt
      - name: Check initial configuration and release privacy
        run: python scripts/verify_public.py
      - name: Run internal self-test
        run: python windows/DailyWorkReports_15.2.py --self-test
